[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurey"
version = "0.1.0"
description = "Standalone deep agent service (LangChain Deep Agents, LangGraph, 1Claw-ready)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langgraph",
    "deepagents>=0.5.8",
    "pydantic-settings",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn[standard]",
]
telegram = [
    "python-telegram-bot>=21",
]
dev = [
    "fastapi>=0.115",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]